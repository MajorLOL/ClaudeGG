name: Mobile Python tests

# The tests of the Python code in Mobile/ (the Pokemon GO bot and the files of
# answers that the C++ ports are held to). The Windows build runs only the
# tests of the agent; these are the other ones: the bot's readers, engine,
# fight loop and the checks that a file of answers (Mobile/tests/fixtures/
# *_golden.json.qz) is what the Python code says now. About four minutes.
#
# The versions are pinned, so that a new release of a library cannot turn this
# red or green by itself.

on:
  push:
    branches: [main]
    paths:
      - 'Mobile/**'
      - '.github/workflows/mobile-python.yml'
  pull_request:
    paths:
      - 'Mobile/**'
      - '.github/workflows/mobile-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install what the tests need
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy==2.2.6 opencv-python-headless==4.12.0.88 ai-edge-litert==2.4.1
          "$RUNNER_TEMP/venv/bin/python" -c "import cv2, numpy; print('OpenCV', cv2.__version__, 'NumPy', numpy.__version__)"

      - name: What this machine does with OpenCV
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          grep -m1 "flags" /proc/cpuinfo | tr ' ' '\n' | grep -E "^(avx|avx2|avx512f|sse4_2|fma)$" | tr '\n' ' ' || true
          echo
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import cv2, numpy as np
          print("OpenCV", cv2.__version__, "threads", cv2.getNumThreads())
          print(cv2.getCPUFeaturesLine())
          rng = np.random.RandomState(1)
          img = rng.randint(0, 255, (552, 442, 3)).astype(np.uint8)
          outs = [cv2.resize(img, (221, 276), interpolation=cv2.INTER_AREA).astype(np.int16) for _ in range(5)]
          print("the same call five times, largest difference:", [int(np.abs(o - outs[0]).max()) for o in outs])
          blocks = img.astype(np.int32).reshape(276, 2, 221, 2, 3).sum(axis=(1, 3))
          ref = ((blocks + 2) // 4).astype(np.int16)
          print("against the mean of 2 x 2 blocks, largest difference:", int(np.abs(outs[0] - ref).max()))
          cv2.setNumThreads(1)
          one = cv2.resize(img, (221, 276), interpolation=cv2.INTER_AREA).astype(np.int16)
          print("with one thread, largest difference to the first:", int(np.abs(one - outs[0]).max()))
          cv2.setNumThreads(0)
          zero = cv2.resize(img, (221, 276), interpolation=cv2.INTER_AREA).astype(np.int16)
          print("with no threads, largest difference to the first:", int(np.abs(zero - outs[0]).max()))
          PY

      - name: Run the tests
        working-directory: Mobile
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest tests.test_spin_stop tests.test_battle_vision tests.test_vision_golden
