name: Mobile Python tests

# The tests of the Python code in Mobile/ (the Pokemon GO bot and the files of
# answers that the C++ ports are held to). The Windows build runs only the
# tests of the agent; these are the other ones: the bot's readers, engine,
# fight loop and the checks that a file of answers (Mobile/tests/fixtures/
# *_golden.json.qz) is what the Python code says now. About four minutes.
#
# The versions are pinned, so that a new release of a library cannot turn this
# red or green by itself.

on:
  push:
    branches: [main]
    paths:
      - 'Mobile/**'
      - '.github/workflows/mobile-python.yml'
  pull_request:
    paths:
      - 'Mobile/**'
      - '.github/workflows/mobile-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install what the tests need
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy==2.2.6 opencv-python-headless==4.12.0.88 ai-edge-litert==2.4.1
          "$RUNNER_TEMP/venv/bin/python" -c "import cv2, numpy; print('OpenCV', cv2.__version__, 'NumPy', numpy.__version__)"

      - name: What this machine does with the comparison of two pictures
        working-directory: Mobile
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import inspect, sys
          sys.path.insert(0, "tests")
          sys.path.insert(0, ".")
          import numpy as np, cv2
          import spin_stop as S
          from test_spin_stop import scene
          print(inspect.getsource(S.compare_shots).split('"""')[2][:900])
          png = scene()
          raw, png2 = png.copy(), png.copy()
          small = lambda im: cv2.resize(im, (221, 276), interpolation=cv2.INTER_AREA).astype(np.int16)
          a, b, r = small(png), small(png2), small(raw)
          print("a-b", int(np.abs(a - b).max()), "a-r", int(np.abs(a - r).max()), "b-r", int(np.abs(b - r).max()))
          print("moved", float(np.abs(a - b).mean()), "still", float((np.abs(a - b).max(axis=2) <= S.SHOT_STILL).mean()))
          for n in range(4):
              res = S.compare_shots(png, png.copy(), png.copy())
              print("compare_shots", n, res["same"], round(res["diff"], 3), round(res["moved"], 3), res["still"])
          x = np.zeros((276, 221, 3), np.int16)
          print("zeros: abs mean", float(np.abs(x - x).mean()), "numpy", np.__version__)
          y = a.copy()
          print("copy of a: abs mean of a - y", float(np.abs(a - y).mean()))
          PY

      - name: Run the tests
        working-directory: Mobile
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest tests.test_spin_stop.CompareShots
